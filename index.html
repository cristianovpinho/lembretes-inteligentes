<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lembretes Inteligentes</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:  ['DM Sans', 'sans-serif'],
            serif: ['DM Serif Display', 'serif'],
          },
        },
      },
    }
  </script>

  <style>
    body { font-family: 'DM Sans', sans-serif; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-enter { animation: fadeUp 0.28s ease forwards; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-enter { animation: slideUp 0.3s cubic-bezier(0.34, 1.2, 0.64, 1) forwards; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 15px; height: 15px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(35%) sepia(60%) saturate(600%) hue-rotate(210deg);
      cursor: pointer;
    }

    .tag-work     { background: rgba(30, 64, 175, 0.1); color: #1e40af; }
    .tag-urgente  { background: rgba(153, 27, 27, 0.1); color: #991b1b; }
    .tag-financas { background: rgba(91, 33, 182, 0.1); color: #5b21b6; }

    .circle-btn {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      background: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.18s;
    }
    .circle-btn.done {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }

    .task-done { background: #f8fafc !important; opacity: 0.6; border-color: #e2e8f0 !important; }
    .task-done .task-title { text-decoration: line-through; color: #94a3b8; }
    .task-done .task-sub   { color: #94a3b8; }

    .task-card .card-actions { opacity: 0; transition: opacity 0.15s; }
    .task-card:hover .card-actions { opacity: 1; }

    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(15, 15, 30, 0.45);
      z-index: 50;
      align-items: flex-end;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal-panel {
      width: 100%; max-width: 520px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 28px 24px 36px;
      max-height: 92vh;
      overflow-y: auto;
    }
    @media (min-height: 600px) and (min-width: 520px) {
      #modal-overlay { align-items: center; }
      #modal-panel   { border-radius: 20px; max-height: 88vh; }
    }

    #toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
      z-index: 100;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Estilo para as bolinhas de seleção de cor */
    .color-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    .color-dot.selected {
      border-color: #0f172a;
      transform: scale(1.15);
    }
  </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl transition-all">
      <div class="text-center mb-6">
        <span class="text-xs font-bold tracking-widest text-emerald-600 uppercase">Acesso Restrito</span>
        <h2 class="font-serif text-2xl text-slate-800 mt-1">Lembretes Inteligentes</h2>
      </div>
      
      <form id="form-login" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Usuário</label>
          <input id="login-user" type="text" placeholder="Digite o usuário" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Senha</label>
          <input id="login-pass" type="password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-400 transition" />
        </div>
        <p id="login-error" class="hidden text-xs text-red-500 font-medium">Usuário ou senha incorretos.</p>
        
        <button type="submit" class="w-full py-3 mt-2 rounded-xl font-semibold text-sm text-white bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] transition-all">
          Entrar no painel
        </button>
      </form>
    </div>
  </div>

  <div id="app-content" class="hidden">
    
    <header class="bg-white border-b border-slate-100 sticky top-0 z-10">
      <div class="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition" aria-label="Sair">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
          <h1 id="header-date" class="font-serif text-xl text-emerald-700 tracking-tight"></h1>
        </div>

        <button onclick="carregarLembretesDoBanco()" class="text-slate-400 hover:text-emerald-700 transition" aria-label="Atualizar data">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18" />
          </svg>
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 pb-28">
      <div id="prog-dots" class="flex items-center gap-2 mb-5 px-1" aria-hidden="true"></div>
      
      <div id="task-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

      <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
        <div class="w-16 h-16 rounded-2xl bg-white border border-slate-200 flex items-center justify-center mb-4">
          <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          </svg>
        </div>
        <p class="text-sm font-medium text-slate-400">Nenhum lembrete ainda</p>
        <p class="text-xs text-slate-300 mt-1">Toque no <strong>+</strong> para criar o primeiro</p>
      </div>
    </main>

    <button id="btn-novo" onclick="abrirModal()" style="width:52px; height:52px;" class="fixed bottom-6 right-5 sm:right-6 rounded-full bg-amber-500 hover:bg-amber-600 active:scale-95 text-white shadow-lg shadow-amber-200 flex items-center justify-center transition-all duration-200 z-40" aria-label="Novo lembrete">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>
    </button>
  </div>

  <div id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="fecharModalSeFundo(event)">
    <div id="modal-panel">
      <div class="w-10 h-1 rounded-full bg-slate-200 mx-auto mb-5"></div>
      <div class="flex items-center justify-between mb-6">
        <h2 id="modal-title" class="font-serif text-lg text-slate-900">Novo lembrete</h2>
        <button onclick="fecharModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center transition" aria-label="Fechar modal">
          <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="form-lembrete" novalidate class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Título da tarefa</label>
          <input id="inp-tarefa" type="text" placeholder="Ex: Reunião de planejamento Q3…" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition"/>
          <p id="err-tarefa" class="hidden mt-1 text-xs text-red-400">Preencha o título.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Categoria</label>
          <div id="cat-group" class="flex flex-wrap gap-2">
            <button type="button" data-cat="work" class="cat-btn tag-work px-3 py-1 rounded-full text-xs font-semibold border-2 border-transparent transition">Work</button>
            <button type="button" data-cat="urgente" class="cat-btn tag-urgente px-3 py-1 rounded-full text-xs font-semibold border-2 border-transparent transition">Urgente</button>
            <button type="button" data-cat="financas" class="cat-btn tag-financas px-3 py-1 rounded-full text-xs font-semibold border-2 border-transparent transition">Finanças</button>
          </div>
          <p id="err-cat" class="hidden mt-1 text-xs text-red-400">Selecione uma categoria.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Cor do Card</label>
          <div id="color-group" class="flex gap-3 pt-1">
            <button type="button" data-color="bg-white" class="color-dot bg-white border border-slate-300 selected" title="Branco"></button>
            <button type="button" data-color="bg-emerald-50" class="color-dot bg-emerald-50" title="Verde"></button>
            <button type="button" data-color="bg-blue-50" class="color-dot bg-blue-50" title="Azul"></button>
            <button type="button" data-color="bg-violet-50" class="color-dot bg-violet-50" title="Roxo"></button>
            <button type="button" data-color="bg-amber-50" class="color-dot bg-amber-50" title="Laranja"></button>
            <button type="button" data-color="bg-rose-50" class="color-dot bg-rose-50" title="Rosa"></button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Descrição <span class="normal-case font-normal text-slate-300 ml-1">(opcional)</span></label>
          <input id="inp-desc" type="text" placeholder="Adicione mais detalhes…" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Data e hora</label>
          <input id="inp-data" type="datetime-local" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition"/>
          <p id="err-data" class="hidden mt-1 text-xs text-red-400">Selecione a data e hora.</p>
        </div>

        <button id="btn-submit" type="submit" class="mt-1 w-full py-3 rounded-2xl font-semibold text-sm text-white bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all flex items-center justify-center gap-2">
          <span id="btn-label">Agendar lembrete</span>
        </button>
      </form>
    </div>
  </div>

  <div id="toast" role="alert">
    <div id="toast-inner" class="flex items-center gap-3 px-5 py-3 rounded-2xl text-sm font-medium bg-white border border-slate-200 shadow-lg text-slate-700 whitespace-nowrap"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://jqwlidtevrodojqtkooo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_zqdsprq_b__djTHp7Kdsjg_lnEUyuzc"; 
    const TABELA       = "lembretes";
    const API_ENDPOINT = `${SUPABASE_URL}/rest/v1/${TABELA}`;
    
    const HEADERS = {
      "Content-Type":  "application/json",
      "apikey":        SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Prefer":        "return=representation",
    };

    let lembretes      = [];   
    let categoriaAtiva = "";  
    let corSelecionada = "bg-white"; // Cor padrão inicial

    const CAT_LABELS = { work:"Work", urgente:"Urgente", financas:"Finanças" };

    // ============================================================
    // SISTEMA DE AUTENTICAÇÃO SIMPLES
    // ============================================================
    const CREDENCIAIS = { usuario: "admin", senha: "senai123@" };

    document.getElementById("form-login").addEventListener("submit", function(e) {
      e.preventDefault();
      const userInp = document.getElementById("login-user").value;
      const passInp = document.getElementById("login-pass").value;
      const errorEl = document.getElementById("login-error");

      if (userInp === CREDENCIAIS.usuario && passInp === CREDENCIAIS.senha) {
        sessionStorage.setItem("autenticado", "true");
        verificarSessao();
      } else {
        errorEl.classList.remove("hidden");
      }
    });

    function verificarSessao() {
      const logado = sessionStorage.getItem("autenticado");
      if (logado === "true") {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("app-content").classList.remove("hidden");
        carregarLembretesDoBanco();
      } else {
        document.getElementById("login-screen").classList.remove("hidden");
        document.getElementById("app-content").classList.add("hidden");
      }
    }

    function logout() {
      sessionStorage.removeItem("autenticado");
      verificarSessao();
    }

    // ============================================================
    // REQUISITOS DO BANCO DE DADOS
    // ============================================================
    (function setHeaderDate() {
      const agora = new Date();
      const str   = agora.toLocaleDateString("pt-BR", { month: "long", day: "numeric" });
      document.getElementById("header-date").textContent = str.charAt(0).toUpperCase() + str.slice(1);
    })();

    async function carregarLembretesDoBanco() {
      try {
        const resp = await fetch(`${API_ENDPOINT}?order=created_at.desc`, {
          method: "GET",
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        lembretes = await resp.json();
        renderizarLista();
      } catch (err) {
        console.error("Erro ao carregar dados:", err);
        exibirToast("Erro ao sincronizar dados com o Supabase.", "erro");
      }
    }

    function atualizarDots() {
      const el     = document.getElementById("prog-dots");
      const total  = Math.min(lembretes.length, 6);
      const feitas = lembretes.filter(t => t.enviado).length;
      let html = "";
      for (let i = 0; i < total; i++) {
        const cor = i < feitas ? "#16a34a" : i < 2 ? "#6366f1" : "#cbd5e1";
        html += `<div style="width:9px;height:9px;border-radius:50%;background:${cor};transition:background 0.2s"></div>`;
      }
      el.innerHTML = html;
    }

    function renderizarLista() {
      const listEl  = document.getElementById("task-list");
      const emptyEl = document.getElementById("empty-state");

      atualizarDots();

      if (lembretes.length === 0) {
        listEl.innerHTML = "";
        emptyEl.classList.remove("hidden");
        emptyEl.classList.add("flex");
        return;
      }

      emptyEl.classList.add("hidden");
      emptyEl.classList.remove("flex");

      listEl.innerHTML = lembretes.map((item, idx) => {
        const done   = item.enviado;
        const label  = CAT_LABELS[item.categoria] || item.categoria || "—";
        // Usa a classe de cor vinda do banco ou cai no 'bg-white' padrão
        const corCard = item.cor || 'bg-white';

        const checkIcon = done ? `<svg style="width:11px;height:11px" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : "";

        const dataFmt = item.data_hora ? (() => {
          const d = new Date(item.data_hora);
          return d.toLocaleDateString("pt-BR", { day:"2-digit", month:"short" }) + " às " + d.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
        })() : "";

        return `
          <div class="task-card ${done ? "task-done" : corCard} rounded-2xl border border-slate-200/60 shadow-sm flex flex-col justify-between p-5 card-enter transition-all" style="animation-delay:${idx * 45}ms">
            <div>
              <div class="flex items-center justify-between mb-3">
                <span class="tag-${item.categoria || "work"} inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold">${escapeHtml(label)}</span>
                
                <div class="card-actions flex items-center gap-1">
                  <button onclick="excluirLembreteDoBanco('${item.id}')" class="w-7 h-7 rounded-lg hover:bg-red-100 flex items-center justify-center transition" aria-label="Excluir lembrete">
                    <svg style="width:14px;height:14px" class="text-slate-400 hover:text-red-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                  </button>
                </div>
              </div>

              <p class="task-title text-base font-semibold text-slate-800 leading-snug">${escapeHtml(item.tarefa)}</p>
              ${item.descricao ? `<p class="task-sub text-xs text-slate-500 mt-1.5 leading-relaxed">${escapeHtml(item.descricao)}</p>` : ""}
            </div>

            <div class="flex items-center justify-between border-t border-slate-200/50 pt-3 mt-4">
              <div class="min-w-0">
                ${dataFmt ? `<p class="text-xs text-slate-400 flex items-center gap-1"><svg style="width:12px;height:12px" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>${dataFmt}</p>` : ""}
              </div>

              <button class="circle-btn flex-shrink-0 ${done ? "done" : "hover:border-slate-400"}" onclick="toggleConcluidoNoBanco('${item.id}', ${done})" aria-label="${done ? "Reabrir" : "Concluir"} tarefa">
                ${checkIcon}
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function toggleConcluidoNoBanco(id, statusAtual) {
      try {
        const response = await fetch(`${API_ENDPOINT}?id=eq.${id}`, {
          method: "PATCH",
          headers: HEADERS,
          body: JSON.stringify({ enviado: !statusAtual })
        });
        if (!response.ok) throw new Error();
        const index = lembretes.findIndex(item => item.id == id);
        if (index !== -1) {
          lembretes[index].enviado = !statusAtual;
          renderizarLista();
        }
      } catch (error) {
        exibirToast("Erro ao atualizar status no servidor.", "erro");
      }
    }

    async function excluirLembreteDoBanco(id) {
      try {
        const response = await fetch(`${API_ENDPOINT}?id=eq.${id}`, {
          method: "DELETE",
          headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
        });
        if (!response.ok) throw new Error();
        lembretes = lembretes.filter(item => item.id != id);
        renderizarLista();
        exibirToast("Lembrete removido", "info");
      } catch (error) {
        exibirToast("Não foi possível excluir do servidor.", "erro");
      }
    }

    // Modal UI Controladores
    function abrirModal() {
      const overlay = document.getElementById("modal-overlay");
      const panel   = document.getElementById("modal-panel");
      overlay.classList.add("open");
      panel.classList.remove("modal-enter");
      void panel.offsetWidth;
      panel.classList.add("modal-enter");
      setTimeout(() => document.getElementById("inp-tarefa").focus(), 50);
    }

    function fecharModal() {
      document.getElementById("modal-overlay").classList.remove("open");
      document.getElementById("form-lembrete").reset();
      categoriaAtiva = "";
      corSelecionada = "bg-white";
      
      // Reseta os aneis das categorias
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("ring-2","ring-offset-1"));
      
      // Reseta a bolinha de cor para a padrão branca
      document.querySelectorAll(".color-dot").forEach(b => b.classList.remove("selected"));
      document.querySelector('[data-color="bg-white"]').classList.add("selected");
      
      esconderErros();
    }

    function fecharModalSeFundo(e) {
      if (e.target === document.getElementById("modal-overlay")) fecharModal();
    }

    document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });

    document.getElementById("cat-group").addEventListener("click", e => {
      const btn = e.target.closest(".cat-btn");
      if (!btn) return;
      categoriaAtiva = btn.dataset.cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("ring-2","ring-offset-1"));
      btn.classList.add("ring-2", "ring-offset-1");
      document.getElementById("err-cat").classList.add("hidden");
    });

    // Evento de escuta para capturar a escolha de cor
    document.getElementById("color-group").addEventListener("click", e => {
      const dot = e.target.closest(".color-dot");
      if (!dot) return;
      corSelecionada = dot.dataset.color;
      document.querySelectorAll(".color-dot").forEach(b => b.classList.remove("selected"));
      dot.classList.add("selected");
    });

    function esconderErros() {
      ["err-tarefa","err-cat","err-data"].forEach(id => document.getElementById(id).classList.add("hidden"));
    }

    function validar() {
      let ok = true;
      if (!document.getElementById("inp-tarefa").value.trim()) { document.getElementById("err-tarefa").classList.remove("hidden"); ok = false; }
      if (!categoriaAtiva) { document.getElementById("err-cat").classList.remove("hidden"); ok = false; }
      if (!document.getElementById("inp-data").value) { document.getElementById("err-data").classList.remove("hidden"); ok = false; }
      return ok;
    }

    let toastTimer = null;
    function exibirToast(msg, tipo = "success") {
      const toast = document.getElementById("toast");
      const inner = document.getElementById("toast-inner");
      const icones = {
        success: `<svg style="width:15px;height:15px;color:#16a34a;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`,
        erro:    `<svg style="width:15px;height:15px;color:#dc2626;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
        info:    `<svg style="width:15px;height:15px;color:#64748b;flex-shrink:0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
      };
      inner.innerHTML = (icones[tipo] || icones.info) + `<span>${msg}</span>`;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 3500);
    }

    function setCarregando(ativo) {
      const btn   = document.getElementById("btn-submit");
      const label = document.getElementById("btn-label");
      if (ativo) {
        btn.disabled = true;
        btn.classList.add("opacity-70","cursor-not-allowed");
        label.innerHTML = `<span class="spinner"></span>&nbsp; Agendando…`;
      } else {
        btn.disabled = false;
        btn.classList.remove("opacity-70","cursor-not-allowed");
        label.textContent = "Agendar lembrete";
      }
    }

    async function enviarLembrete(e) {
      e.preventDefault();
      esconderErros();
      if (!validar()) return;

      setCarregando(true);

      const novoLembrete = {
        tarefa:          document.getElementById("inp-tarefa").value.trim(),
        descricao:       document.getElementById("inp-desc").value.trim(),
        data_hora:       document.getElementById("inp-data").value,
        categoria:       categoriaAtiva,
        cor:             corSelecionada, // Envia a cor escolhida para a nova coluna do Supabase
        enviado:         false,
        usuario_contato: "Web App"
      };

      try {
        const resp = await fetch(API_ENDPOINT, {
          method:  "POST",
          headers: HEADERS,
          body:    JSON.stringify(novoLembrete),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.message || `HTTP ${resp.status}`);
        }

        const dataRetornada = await resp.json();
        const inserido = Array.isArray(dataRetornada) ? dataRetornada[0] : dataRetornada;

        lembretes.unshift(inserido || novoLembrete);
        renderizarLista();
        exibirToast("Lembrete agendado!", "success");
        fecharModal();
      } catch (err) {
        console.error("Erro ao enviar:", err);
        exibirToast("Erro: " + err.message, "erro");
      } finally {
        setCarregando(false);
      }
    }

    function escapeHtml(texto) {
      const div = document.createElement("div");
      div.appendChild(document.createTextNode(texto));
      return div.innerHTML;
    }

    document.getElementById("form-lembrete").addEventListener("submit", enviarLembrete);
    ["inp-tarefa","inp-data"].forEach(id => {
      document.getElementById(id).addEventListener("input", esconderErros);
    });

    verificarSessao();
  </script>
</body>
</html>
